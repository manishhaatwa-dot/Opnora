<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Opnora Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

<div class="sidebar">

<div class="logo">

<i class="fa-solid fa-layer-group"></i>

<h2>Opnora</h2>

<p>Admin Panel</p>

</div>

<ul>

<li class="active">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</li>

<li onclick="location.href='dashboard.html'" class="active">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</li>

<li onclick="location.href='projects.html'">
<i class="fa-solid fa-folder-open"></i>
Projects
</li>

<li onclick="location.href='add-project.html'">
<i class="fa-solid fa-plus"></i>
Add Project
</li>

<li onclick="location.href='settings.html'">
<i class="fa-solid fa-gear"></i>
Settings
</li>

<li id="logoutBtn">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</li>

</ul>

</div>

<div class="main-content">

<div class="topbar">

<h1>Welcome, Admin ??</h1>

<p>Manage your Opnora website from one place.</p>

</div>

<div class="cards">

<div class="card">

<i class="fa-solid fa-folder-open"></i>

<h2 id="projectCount">0</h2>

<p>Total Projects</p>

</div>

<div class="card">

<i class="fa-solid fa-eye"></i>

<h2>0</h2>

<p>Total Views</p>

</div>

<div class="card">

<i class="fa-solid fa-link"></i>

<h2>0</h2>

<p>Live Projects</p>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
