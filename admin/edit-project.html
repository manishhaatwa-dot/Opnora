<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Project | Opnora Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

<div class="sidebar">

<div class="logo">
<i class="fa-solid fa-layer-group"></i>
<h2>Opnora</h2>
<p>Admin Panel</p>
</div>

<ul>

<li onclick="location.href='dashboard.html'">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</li>

<li onclick="location.href='projects.html'">
<i class="fa-solid fa-folder-open"></i>
Projects
</li>

<li onclick="location.href='add-project.html'">
<i class="fa-solid fa-plus"></i>
Add Project
</li>

<li onclick="location.href='settings.html'">
<i class="fa-solid fa-gear"></i>
Settings
</li>

<li id="logoutBtn">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</li>

</ul>

</div>

<div class="main-content">

<h1>Edit Project</h1>

<form id="editProjectForm">

<div class="form-group">
<label>Project Name</label>
<input type="text" id="projectName" required>
</div>

<div class="form-group">
<label>Description</label>
<textarea id="projectDescription" rows="5" required></textarea>
</div>

<div class="form-group">
<label>Project Link</label>
<input type="url" id="projectLink" required>
</div>

<div class="form-group">
<label>Category</label>

<select id="projectCategory">

<option>Website</option>
<option>Android App</option>
<option>AI</option>
<option>Software</option>

</select>

</div>

<div class="form-group">

<label>Replace Image (Optional)</label>

<input type="file" id="projectImage" accept="image/*">

</div>

<button class="save-btn" type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Update Project

</button>

</form>

</div>

</div>

<script src="edit-project.js"></script>

</body>
</html>
