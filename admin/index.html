<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opnora Admin Panel</title>
  <style>
    :root {
      --primary: #111;
      --bg: #f6f6f6;
      --card: #ffffff;
      --border: #dddddd;
      --muted: #666666;
      --danger: #dc3545;
      --secondary: #555555;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: #111;
    }

    .container {
      max-width: 860px;
      margin: 40px auto;
      padding: 20px;
      background: var(--card);
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    p {
      color: var(--muted);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      background: var(--primary);
      color: #fff;
    }

    .btn:hover {
      opacity: 0.92;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-secondary {
      background: var(--secondary);
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
      background: #fff;
    }

    .card img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fafafa;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-body h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .card-body p {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .card-body a {
      font-size: 13px;
      color: #0b57d0;
      word-break: break-all;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .center-box {
      text-align: center;
      padding: 48px 0;
    }

    .status {
      margin: 16px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-content {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.16);
      max-height: 90vh;
      overflow: auto;
    }

    .modal-content h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }

    .form-group small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    @media (max-width: 700px) {
      .card {
        flex-direction: column;
        align-items: stretch;
      }

      .card img {
        width: 100%;
        height: 190px;
      }

      .card-actions {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading-state" class="center-box">Checking authorization...</div>

    <div id="login-view" class="center-box" style="display:none;">
      <h1>Opnora Admin Access</h1>
      <p>Authentication required to manage projects.</p>
      <button class="btn" onclick="login()">Login with GitHub</button>
    </div>

    <div id="dashboard-view" style="display:none;">
      <div class="header-row">
        <div>
          <h1>Manage Projects</h1>
          <p style="margin:0;">Secure admin panel connected to GitHub.</p>
        </div>
        <div class="actions">
          <button class="btn" onclick="openModal()">+ Add Project</button>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
      </div>

      <div id="loading" class="status" style="display:none;">Processing... Please wait.</div>
      <div id="projects-list"></div>
    </div>
  </div>

  <div class="modal" id="project-modal">
    <div class="modal-content">
      <h2 id="modal-title">Add Project</h2>
      <input type="hidden" id="edit-index" value="-1" />
      <input type="hidden" id="existing-image" value="" />

      <div class="form-group">
        <label for="p-title">Title</label>
        <input type="text" id="p-title" required />
      </div>

      <div class="form-group">
        <label for="p-desc">Description</label>
        <textarea id="p-desc" rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label for="p-link">Link (URL)</label>
        <input type="url" id="p-link" required />
      </div>

      <div class="form-group">
        <label for="p-button">Button Text</label>
        <input type="text" id="p-button" value="Visit Website" required />
      </div>

      <div class="form-group">
        <label for="p-image">Image Upload</label>
        <input type="file" id="p-image" accept="image/jpeg,image/png,image/webp,image/gif" />
        <small>Max 5MB. Leave empty to keep existing image when editing.</small>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancel</button>
        <button class="btn" id="save-btn" type="button" onclick="saveProject()">Save Project</button>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://opnora-admin-api.manishhaatwa.workers.dev";
    let projects = [];

    function getToken() {
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const tokenFromHash = hashParams.get("token");

      if (tokenFromHash) {
        sessionStorage.setItem("opnora_token", tokenFromHash);
        history.replaceState(null, "", window.location.pathname);
        return tokenFromHash;
      }

      return sessionStorage.getItem("opnora_token");
    }

    function clearToken() {
      sessionStorage.removeItem("opnora_token");
    }

    function showLoginView() {
      document.getElementById("loading-state").style.display = "none";
      document.getElementById("dashboard-view").style.display = "none";
      document.getElementById("login-view").style.display = "block";
    }

    function showDashboardView() {
      document.getElementById("loading-state").style.display = "none";
      document.getElementById("login-view").style.display = "none";
      document.getElementById("dashboard-view").style.display = "block";
    }

    function showLoading(show) {
      document.getElementById("loading").style.display = show ? "block" : "none";
      const list = document.getElementById("projects-list");
      list.style.opacity = show ? "0.55" : "1";
      list.style.pointerEvents = show ? "none" : "auto";
    }

    async function secureFetch(endpoint, options = {}) {
      const token = getToken();
      const headers = { ...(options.headers || {}) };

      if (!(options.body instanceof FormData)) {
        headers["Content-Type"] = "application/json";
      }

      if (token) {
        headers["Authorization"] = `Bearer ${token}`;
      }

      const response = await fetch(`${WORKER_URL}${endpoint}`, {
        ...options,
        headers
      });

      if (response.status === 401 || response.status === 403) {
        clearToken();
        showLoginView();
        throw new Error("Unauthorized");
      }

      return response;
    }

    async function checkAuth() {
      try {
        const token = getToken();
        if (!token) {
          showLoginView();
          return;
        }

        const res = await secureFetch("/api/check-auth");
        if (!res.ok) throw new Error("Auth check failed");

        showDashboardView();
        await loadProjects();
      } catch {
        showLoginView();
      }
    }

    function login() {
      window.location.href = `${WORKER_URL}/auth/login`;
    }

    function logout() {
      clearToken();
      window.location.reload();
    }

    async function loadProjects() {
      showLoading(true);
      try {
        const res = await secureFetch("/api/projects");
        if (!res.ok) throw new Error("Failed to load projects");
        projects = await res.json();
        renderProjects();
      } catch (err) {
        if (err.message !== "Unauthorized") {
          alert("Failed to load projects.");
        }
      } finally {
        showLoading(false);
      }
    }

    function renderProjects() {
      const list = document.getElementById("projects-list");

      if (!Array.isArray(projects) || projects.length === 0) {
        list.innerHTML = `<div class="empty">No projects found. Add your first project.</div>`;
        return;
      }

      list.innerHTML = projects.map((p, index) => `
        <div class="card">
          <img
            src="../${p.image || ''}"
            alt="${escapeHtml(p.title || 'Project image')}"
            onerror="this.src='https://via.placeholder.com/300x190?text=No+Image'"
          />
          <div class="card-body">
            <h3>${escapeHtml(p.title || "")}</h3>
            <p>${escapeHtml(p.description || "")}</p>
            <a href="${escapeAttribute(p.link || "#")}" target="_blank" rel="noopener noreferrer">${escapeHtml(p.link || "")}</a>
          </div>
          <div class="card-actions">
            <button class="btn" type="button" onclick="openModal(${index})">Edit</button>
            <button class="btn btn-danger" type="button" onclick="deleteProject(${index})">Delete</button>
          </div>
        </div>
      `).join("");
    }

    function openModal(index = -1) {
      document.getElementById("edit-index").value = index;
      document.getElementById("modal-title").innerText = index === -1 ? "Add Project" : "Edit Project";

      if (index > -1) {
        const p = projects[index];
        document.getElementById("p-title").value = p.title || "";
        document.getElementById("p-desc").value = p.description || "";
        document.getElementById("p-link").value = p.link || "";
        document.getElementById("p-button").value = p.button || "Visit Website";
        document.getElementById("existing-image").value = p.image || "";
      } else {
        document.getElementById("p-title").value = "";
        document.getElementById("p-desc").value = "";
        document.getElementById("p-link").value = "";
        document.getElementById("p-button").value = "Visit Website";
        document.getElementById("existing-image").value = "";
      }

      document.getElementById("p-image").value = "";
      document.getElementById("project-modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("project-modal").style.display = "none";
    }

    async function saveProject() {
      const btn = document.getElementById("save-btn");
      btn.disabled = true;
      btn.innerText = "Saving...";

      try {
        const index = parseInt(document.getElementById("edit-index").value, 10);
        const title = document.getElementById("p-title").value.trim();
        const description = document.getElementById("p-desc").value.trim();
        const link = document.getElementById("p-link").value.trim();
        const button = document.getElementById("p-button").value.trim();
        const imageFile = document.getElementById("p-image").files[0];
        let finalImagePath = document.getElementById("existing-image").value.trim();

        if (!title || !description || !link || !button) {
          alert("Please fill all required fields.");
          return;
        }

        if (imageFile) {
          if (imageFile.size > 5 * 1024 * 1024) {
            alert("Image size must be less than 5MB.");
            return;
          }

          finalImagePath = await uploadImage(imageFile);
          if (!finalImagePath) {
            return;
          }
        }

        const projectData = {
          title,
          description,
          image: finalImagePath,
          link,
          button
        };

        if (index > -1) {
          projects[index] = projectData;
        } else {
          projects.push(projectData);
        }

        await syncToGitHub();
        closeModal();
      } catch (err) {
        if (err.message !== "Unauthorized") {
          alert("Failed to save project.");
        }
      } finally {
        btn.disabled = false;
        btn.innerText = "Save Project";
      }
    }

    async function deleteProject(index) {
      if (!confirm("Are you sure you want to delete this project?")) return;

      try {
        projects.splice(index, 1);
        await syncToGitHub();
      } catch (err) {
        if (err.message !== "Unauthorized") {
          alert("Failed to delete project.");
        }
      }
    }

    async function uploadImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();

        reader.onload = async (e) => {
          const base64String = e.target.result.split(",")[1];
          const safeFilename = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, "")}`;

          try {
            const res = await secureFetch("/api/upload", {
              method: "POST",
              body: JSON.stringify({
                filename: safeFilename,
                base64content: base64String
              })
            });

            const data = await res.json();

            if (data.success) {
              resolve(data.path);
            } else {
              alert("Image upload failed: " + (data.error || "Unknown error"));
              resolve(null);
            }
          } catch {
            alert("Image upload failed.");
            resolve(null);
          }
        };

        reader.onerror = () => {
          alert("Could not read the image file.");
          resolve(null);
        };

        reader.readAsDataURL(file);
      });
    }

    async function syncToGitHub() {
      showLoading(true);

      try {
        const res = await secureFetch("/api/projects", {
          method: "POST",
          body: JSON.stringify(projects)
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || "Failed to sync projects");
        }

        renderProjects();
      } finally {
        showLoading(false);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeAttribute(value) {
      return String(value).replaceAll('"', "&quot;");
    }

    document.getElementById("project-modal").addEventListener("click", (e) => {
      if (e.target.id === "project-modal") {
        closeModal();
      }
    });

    window.addEventListener("load", checkAuth);
  </script>
</body>
</html>
